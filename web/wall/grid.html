<body>
<div id="wallStage">

<div id="debugOverlay"></div>

<script>

let images=[]
let config={}
let ws=null

let wallStartTime=Date.now()
let debugLogs=[]

const imageTypes=["jpg","jpeg","png","webp","gif"]
const videoTypes=["mp4","mov","webm"]

let serverStateChannel=null
let serverOnline=false
let wakeLockSentinel=null
let wakeLockActive=false
let altWakeLockVideo=null
let altWakeLockCanvas=null
let altWakeLockActive=false
let altWakeLockTick=null
let cachedImages=new Set()
let cacheInventory={images:0,videos:0,bytes:0,quota:0,usage:0}
let cacheInventoryBusy=false
let mediaListLoaded=false
let photowallPaused=false
let catchUpBusy=false
let lastBroadcastState=null
let connectionFadeTimer=null
let qrTimer=null
let bannerTimer=null

function fmtCacheBytes(n){
n=Number(n)||0
if(n<1024) return n+" B"
if(n<1048576) return (n/1024).toFixed(1)+" KB"
if(n<1073741824) return (n/1048576).toFixed(1)+" MB"
return (n/1073741824).toFixed(2)+" GB"
}
function revokeBlobUrl(url){
if(!url) return
url=String(url)
if(url.indexOf("blob:")===0){
try{ URL.revokeObjectURL(url) }catch(e){}
}
}
function revokeElMedia(el){
if(!el) return
revokeBlobUrl(el.getAttribute("src")||el.src||"")
try{ el.removeAttribute("src"); el.src="" }catch(e){}
}
function dropCell(cell){
if(!cell) return
cell.querySelectorAll("img,video").forEach(revokeElMedia)
try{ cell.remove() }catch(e){}
}
function cacheNameFromUrl(url){
return (String(url||"").split("/").pop()||"").split("?")[0]
}
function isCachedVideo(fn){
let ext=(String(fn||"").split(".").pop()||"").toLowerCase()
return videoTypes.includes(ext)
}
function cachedFilenames(kind){
let list=[]
cachedImages.forEach(fn=>{
if(!fn||String(fn).endsWith(".txt")) return
let vid=isCachedVideo(fn)
if(kind==="video"?vid:!vid) list.push(fn)
})
return list
}
function ingestCachedFilename(fn){
fn=(fn||"").split("?")[0]
if(!fn||fn.endsWith(".txt")) return
cachedImages.add(fn)
if(serverOnline) return
let ext=(fn.split(".").pop()||"").toLowerCase()
if(imageTypes.includes(ext) && !images.includes(fn)) images.push(fn)
}
function mediaSrc(file){
return typeof pfUrl==="function"?pfUrl("/media/"+file):("/media/"+file)
}
async function cacheResponseForFile(file){
let fn=(file||"").split("?")[0]
if(!fn||!("caches" in window)) return null
try{
let cache=await caches.open("wall-media-v1")
let direct=mediaSrc(fn)
let res=await cache.match(direct)
if(res) return res
res=await cache.match(new Request(direct))
if(res) return res
let keys=await cache.keys()
for(let req of keys){
if(cacheNameFromUrl(req.url)!==fn) continue
res=await cache.match(req)
if(res) return res
}
}catch(e){}
return null
}
function wsIsOpen(){
return !!(ws && ws.readyState===WebSocket.OPEN)
}
function useCachePool(){
if(!(config&&config.cache_enabled)) return false
if(wsIsOpen()) return false
if(ws && ws.readyState===WebSocket.CONNECTING) return false
return true
}
async function fillMediaSrc(element, file){
if(useCachePool()){
let res=await cacheResponseForFile(file)
if(!res){
addDebugLog("nicht im Cache: "+file)
return false
}
element.src=URL.createObjectURL(await res.blob())
addDebugLog("aus Cache: "+file)
return true
}
element.src=mediaSrc(file)
return true
}
async function clearWallMediaCache(){
try{
await caches.delete("wall-media-v1")
await caches.delete("wall-media-meta-v1")
}catch(e){}
cachedImages=new Set()
cacheInventory={images:0,videos:0,bytes:0,quota:cacheInventory.quota||0,usage:0}
addDebugLog("Cache geleert")
if(typeof updateDebug==="function") updateDebug()
}
window.clearWallMediaCache=clearWallMediaCache
async function refreshCacheInventory(){
if(!("caches" in window) || cacheInventoryBusy) return
cacheInventoryBusy=true
try{
let cache=await caches.open("wall-media-v1")
let metaCache=await caches.open("wall-media-meta-v1")
let keys=await cache.keys()
let next=new Set()
let bytes=0, img=0, vid=0
for(let req of keys){
let fn=cacheNameFromUrl(req.url)
if(!fn||fn.endsWith(".txt")||next.has(fn)) continue
next.add(fn)
if(isCachedVideo(fn)) vid++; else img++
let sz=0
let m=await metaCache.match(req.url)
if(m){
try{ let j=await m.json(); sz=Number(j.s)||0 }catch(e){}
}
if(!sz){
try{
let res=await cache.match(req)
if(res) sz=Number(res.headers.get("Content-Length"))||0
}catch(e){}
}
bytes+=sz
}
cachedImages=next
if(!wsIsOpen()) next.forEach(ingestCachedFilename)
let quota=0, usage=0
try{
if(navigator.storage&&navigator.storage.estimate){
let est=await navigator.storage.estimate()
quota=Number(est.quota)||0
usage=Number(est.usage)||0
}
}catch(e){}
cacheInventory={images:img,videos:vid,bytes:bytes,quota:quota,usage:usage}
}catch(e){}
cacheInventoryBusy=false
}

let lastWsRx=0
function markWsAlive(){
lastWsRx=Date.now()
}

function notifyServerState(state){
if(!config||!config.cache_enabled) return
if(!serverStateChannel) serverStateChannel=new BroadcastChannel("wall-server-state")
if(lastBroadcastState===state) return
lastBroadcastState=state
serverStateChannel.postMessage({state:state})
}

function setConnection(state){
let icon=document.getElementById("connectionStatus")
if(!icon) return
let nowOnline=state==="online"
let changed=serverOnline!==nowOnline
serverOnline=nowOnline
if(changed){
if(connectionFadeTimer){
clearTimeout(connectionFadeTimer)
connectionFadeTimer=null
}
if(nowOnline){
icon.style.transition="opacity 1s"
icon.style.background="lime"
icon.style.opacity=1
connectionFadeTimer=setTimeout(()=>{
connectionFadeTimer=null
if(serverOnline) icon.style.opacity=0
},5000)
catchUpMedia()
if(!photowallPaused && window.pfPhotowall && pfPhotowall.startTimers) pfPhotowall.startTimers()
}else{
icon.style.transition="none"
icon.style.background="red"
icon.style.opacity=1
void icon.offsetWidth
icon.style.transition="opacity 1s"
refreshCacheInventory()
}
}
notifyServerState(state)
if(typeof updateDebug==="function") updateDebug()
}

function waitingForFirstPing(){
if(!ws) return false
if(ws.readyState===WebSocket.CONNECTING) return true
return ws.readyState===WebSocket.OPEN && lastWsRx===0
}

async function connectionWatchdog(){
if(waitingForFirstPing() && !serverOnline) return
let httpOk=false
try{
let ctrl=new AbortController()
let t=setTimeout(()=>ctrl.abort(),2500)
let res=await fetch("/api/config?pf="+Date.now(),{cache:"no-store",signal:ctrl.signal})
clearTimeout(t)
httpOk=!!res.ok
}catch(e){ httpOk=false }
let wsOk=ws && ws.readyState===WebSocket.OPEN
let wsFresh=wsOk && lastWsRx>0 && (Date.now()-lastWsRx)<15000
if(httpOk && wsFresh) setConnection("online")
else if(waitingForFirstPing() && !serverOnline) return
else {
if(serverOnline && wsOk){
try{ ws.close() }catch(e){}
}
setConnection("offline")
}
}

function addDebugLog(msg){
if(!config.debug_overlay) return
let elapsed=((Date.now()-wallStartTime)/1000).toFixed(1)
let line="["+elapsed+"s] "+msg
if(debugLogs.length>0&&debugLogs[debugLogs.length-1].replace(/\[\d+\.\d+s\] /,"")===msg) return
debugLogs.push(line)
if(debugLogs.length>10) debugLogs.shift()
console.log("[WALL GRID DEBUG]",line)
}

function updateDebug(){
let box=document.getElementById("debugOverlay")
document.body.classList.toggle("debug-mode",!!config.debug_overlay)
document.querySelectorAll(".frameDebugFilename").forEach(el=>{el.style.display=config.debug_overlay?"block":"none"})
if(window.syncDebugWallRotate) syncDebugWallRotate(config)
if(!config.debug_overlay){
box.style.display="none"
return
}
box.style.display="block"
let cols=Math.max(1,parseInt(config.grid_columns)||4)
let duration=parseFloat(config.grid_animation_duration||config.grid_interval)||8
let total=0
document.querySelectorAll(".gridCell").forEach(c=>{ if(c.dataset.colIndex!==undefined) total++ })
let spCol="grid_spacing_columns"in config?Math.max(0,parseInt(config.grid_spacing_columns)||0):(config.grid_spacing_rows!=null?Math.max(0,parseInt(config.grid_spacing_rows)||0):20)
let spRow="grid_spacing_rows"in config?Math.max(0,parseInt(config.grid_spacing_rows)||0):(config.grid_spacing!=null?Math.max(0,parseInt(config.grid_spacing)||0):0)
let cacheOn=config.cache_enabled?"aktiv":"aus"
let cacheTtl=config.cache_ttl_minutes||30
let wakeLockEnabled=config.screen_wake_lock_enabled
let altWakeEnabled=config.screen_wake_lock_alternative
let wakeLockStatus="aus"
if(wakeLockEnabled&&wakeLockActive) wakeLockStatus="aktiv (Wake Lock)"
else if(altWakeEnabled&&altWakeLockActive) wakeLockStatus="aktiv (Alternative)"
else if(wakeLockEnabled) wakeLockStatus="aktiv (Wake Lock, API nicht verfügbar)"
else if(altWakeEnabled) wakeLockStatus="aktiv (Alternative, nicht verfügbar)"
box.innerHTML=
"Grid Mode<br>"+
"Spalten: "+cols+" | Abstand Spalten: "+spCol+"px | Abstand Zeilen: "+spRow+"px<br>"+
"Bilder gesamt: "+total+"<br>"+
"Durchlaufzeit: "+duration+"s<br>"+
"Pool: "+images.length+" (Wiederholung erlaubt)<br>"+
"Verbindung: "+(wsIsOpen()?"verbunden":"getrennt")+"<br>"+
"Cache: "+cacheOn+(config.cache_enabled?" (TTL "+cacheTtl+"min, max "+(config.cache_max_images||100)+" Bilder / "+(config.cache_max_videos||20)+" Videos / "+(config.cache_max_size_mb??500)+" MB)":"")+"<br>"+
"Browser-Cache: "+cacheInventory.images+" Bilder, "+cacheInventory.videos+" Videos, "+fmtCacheBytes(cacheInventory.bytes)+(cacheInventory.quota?" · Quota "+fmtCacheBytes(cacheInventory.usage)+"/"+fmtCacheBytes(cacheInventory.quota):"")+" (nur schon angezeigte Dateien)<br>"+
((window.pfWallManager&&pfWallManager.debugLine)?(pfWallManager.debugLine()+"<br>"):"")+
"Bildschirm wach: "+wakeLockStatus
if(debugLogs.length){
box.innerHTML+="<br>Log:<br>"+debugLogs.join("<br>")
}
}

let reconnectTimeout=null
function connectWebSocket(){
ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host+"/ws")
ws.onopen=()=>{ sendStats() }
ws.onclose=()=>{
lastWsRx=0
setConnection("offline")
if(reconnectTimeout) clearTimeout(reconnectTimeout)
reconnectTimeout=setTimeout(()=>{
reconnectTimeout=null
connectWebSocket()
},3000)
}
ws.onerror=()=>{
if(ws && ws.readyState===WebSocket.CONNECTING) return
if(!serverOnline) return
setConnection("offline")
}

function sendStats(){
if(ws&&ws.readyState===WebSocket.OPEN){
let n=document.querySelectorAll(".gridCell").length
try{ ws.send(JSON.stringify({type:"stats",images:n,videos:0})) }catch(e){}
}
}
setInterval(sendStats,5000)
window.addEventListener("offline",()=>setConnection("offline"))
setInterval(connectionWatchdog,4000)
setInterval(()=>{ if(config&&config.cache_enabled) refreshCacheInventory() },10000)

function markFromCache(file){
if(!config.debug_overlay) return
const fn=(file||"").split("?")[0]
function tryMark(){
document.querySelectorAll(".gridCell").forEach(c=>{
if((c.dataset.file||"").split("?")[0]===fn) c.classList.add("from-cache")
})
}
tryMark()
setTimeout(tryMark,100)
setTimeout(tryMark,400)
}
let lastCacheLog={}
const CACHE_LOG_DEBOUNCE_MS=1000
if("serviceWorker"in navigator){
navigator.serviceWorker.addEventListener("message",e=>{
if(e.data&&e.data.type==="cache_serve"){
ingestCachedFilename(e.data.file)
markFromCache(e.data.file)
const key="serve:"+e.data.file
if(Date.now()-(lastCacheLog[key]||0)<CACHE_LOG_DEBOUNCE_MS) return
lastCacheLog[key]=Date.now()
addDebugLog("Cache geladen: "+e.data.file+(e.data.expired?" (abgelaufen)":""))
}else if(e.data&&e.data.type==="cache_store"){
ingestCachedFilename(e.data.file)
const key="store:"+e.data.file
if(Date.now()-(lastCacheLog[key]||0)<CACHE_LOG_DEBOUNCE_MS) return
lastCacheLog[key]=Date.now()
addDebugLog("Cache gespeichert: "+e.data.file)
}else if(e.data&&e.data.type==="cache_list"){
const list=e.data.files||[]
list.forEach(f=>ingestCachedFilename(f))
refreshCacheInventory()
if(config.debug_overlay&&list.length>0){
const key="cache_list"
if(Date.now()-(lastCacheLog[key]||0)<CACHE_LOG_DEBOUNCE_MS) return
lastCacheLog[key]=Date.now()
addDebugLog("Cache-Liste: "+list.length+" Bilder verfügbar")
}
}
})
}
ws.onmessage=async(event)=>{
markWsAlive()
if(event.data==="__ping__"){
setConnection("online")
return
}
if(event.data==="__config_reload__"){ location.reload(); return }
if(event.data==="__media_sync__"){ await catchUpMedia(); return }
if(event.data==="__config_updated__"){
let r=await fetch("/api/config"); config=await r.json()
if(window.applyWallDisplayRotation) applyWallDisplayRotation(config)
applyBackground()
loadCommentFont()
setupQR()
setupBanner()
applyWakeLock()
await updateCacheSw()
return
}
if(event.data==="__wall_manager_updated__"){
if(window.pfWallManager&&pfWallManager.reload) pfWallManager.reload()
return
}
if(event.data==="__wm_playhead__"){
if(window.pfWallManager&&pfWallManager.sync) pfWallManager.sync()
return
}
if(typeof event.data==="string" && event.data.indexOf("__hide__:")===0){
hideMedia(event.data.slice(9))
return
}
let file=event.data
if(file&&!images.includes(file)){
let ext=file.split(".").pop().toLowerCase()
if(imageTypes.includes(ext)){ images.push(file); addDebugLog("new image: "+file) }
}
}
}

function addMedia(file){
if(!file || file.indexOf("__")===0) return
if(images.includes(file)) return
let ext=file.split(".").pop().toLowerCase()
if(imageTypes.includes(ext)) images.push(file)
}

async function catchUpMedia(){
if(catchUpBusy) return
catchUpBusy=true
let asNew=mediaListLoaded
try{
let res=await fetch("/api/images")
let files=await res.json()
if(!Array.isArray(files)) files=[]
let remote=new Set(files)
for(let f of images.slice()){
if(!remote.has(f)) hideMedia(f)
}
let added=0
for(let f of files){
if(images.includes(f)) continue
addMedia(f)
added++
if(asNew) addDebugLog("catch-up image: "+f)
}
mediaListLoaded=true
if(added && asNew) addDebugLog("Nach Sync: "+added+" neue Datei(en)")
}catch(e){
addDebugLog("Nach Sync fehlgeschlagen")
}finally{
catchUpBusy=false
}
}

function hideMedia(file){
if(!file) return
images=images.filter(f=>f!==file)
reservedImages.delete(file)
document.querySelectorAll(".gridCell").forEach(cell=>{
if((cell.dataset.file||"").split("?")[0]!==file) return
dropCell(cell)
})
addDebugLog("hidden from wall: "+file)
}

let reservedImages=new Set()
function getDisplayedImages(){
return new Set(Array.from(document.querySelectorAll(".gridCell")).map(c=>c.dataset.file).filter(Boolean))
}
function chooseRandomImage(){
let displayed=getDisplayedImages()
let pool=images
if(config.cache_enabled&&useCachePool()){
pool=cachedFilenames("image")
if(pool.length===0) return null
}else if(images.length===0) return null
let unused=pool.filter(f=>!displayed.has(f)&&!reservedImages.has(f))
let pickFrom=unused.length?unused:pool
if(!pickFrom.length) return null
let chosen=pickFrom[Math.floor(Math.random()*pickFrom.length)]
reservedImages.add(chosen)
return chosen
}

function spawnImage(colIndex,spawnTop){
if(photowallPaused) return
let file=chooseRandomImage()
if(!file) return

addDebugLog("spawn col "+colIndex+": "+file)

let cols=Math.max(1,parseInt(config.grid_columns)||4)
let spacingCol="grid_spacing_columns"in config?Math.max(0,parseInt(config.grid_spacing_columns)||0):(config.grid_spacing_rows!=null?Math.max(0,parseInt(config.grid_spacing_rows)||0):20)
let spacingRow="grid_spacing_rows"in config?Math.max(0,parseInt(config.grid_spacing_rows)||0):(config.grid_spacing!=null?Math.max(0,parseInt(config.grid_spacing)||0):0)
let colWidth=Math.max(1,(wallInnerWidth()-(cols-1)*spacingCol)/cols)
let size=colWidth
let startX=colIndex*(colWidth+spacingCol)

let cell=document.createElement("div")
cell.className="gridCell"
cell.dataset.file=file
cell.dataset.colIndex=colIndex

let inner=document.createElement("div")
inner.className="gridCellInner"

let img=document.createElement("img")
img.loading="eager"
inner.appendChild(img)
if(config.grid_show_frames!==false){
if(window.applyPhotoFramePadding) applyPhotoFramePadding(inner, size, config)
else{
let padT=config.frame_padding_top||0
let padS=config.frame_padding_side||0
let padB=config.frame_padding_bottom||0
inner.style.padding=padT+"px "+padS+"px "+padB+"px "+padS+"px"
}
inner.style.boxSizing="border-box"
if(spacingCol>0||spacingRow>0){
inner.style.boxShadow="0 4px 15px rgba(0,0,0,0.5)"
}else{
inner.style.boxShadow="none"
}
}else{
if(window.photoFrameScale) inner.dataset.frameScale=String(photoFrameScale(size))
inner.style.background="transparent"
inner.style.boxShadow="none"
}
if(window.attachPhotoComment) attachPhotoComment(inner, file, config)
let dbg=document.createElement("div")
dbg.className="frameDebugFilename"
dbg.textContent=file
inner.appendChild(dbg)

cell.appendChild(inner)

if(spacingRow>0){
let spacer=document.createElement("div")
spacer.className="gridCellSpacer"
spacer.style.height=spacingRow+"px"
spacer.style.minHeight=spacingRow+"px"
cell.appendChild(spacer)
}

let startY=spawnTop!=null?spawnTop:wallInnerHeight()+50

cell.style.width=size+"px"
cell.style.left=startX+"px"
cell.style.top=startY+"px"

document.getElementById("gridContainer").appendChild(cell)

let duration=(parseFloat(config.grid_animation_duration||config.grid_interval)||8)*1000
let travelDist=wallInnerHeight()+200
let speedPxPerSec=travelDist/(duration/1000)

let spawnTime=Date.now()

function startAnimation(){
let loadDelay=Date.now()-spawnTime
let startTime=Date.now()-loadDelay
let pauseAccum=0
let pausedAt=null

function animate(){
if(!document.body.contains(cell)) return
if(photowallPaused){
if(!pausedAt) pausedAt=Date.now()
requestAnimationFrame(animate)
return
}
if(pausedAt){
pauseAccum+=Date.now()-pausedAt
pausedAt=null
}

let elapsed=(Date.now()-startTime-pauseAccum)/1000
let y=startY-speedPxPerSec*elapsed
cell.style.top=y+"px"

let rect=wallClientRect(cell)
if(rect.bottom<-50) return

requestAnimationFrame(animate)
}

requestAnimationFrame(animate)
}

function startExitWatcher(){
function check(){
if(!document.body.contains(cell)) return
if(photowallPaused){
requestAnimationFrame(check)
return
}

let rect=wallClientRect(cell)
let col=parseInt(cell.dataset.colIndex,10)

if(rect.bottom<-50){
reservedImages.delete(file)
dropCell(cell)
addDebugLog("removed col "+col+" after leaving: "+file+" rect="+JSON.stringify({
top:Math.round(rect.top),
bottom:Math.round(rect.bottom),
left:Math.round(rect.left),
right:Math.round(rect.right)
}))
let spacingRow="grid_spacing_rows"in config?Math.max(0,parseInt(config.grid_spacing_rows)||0):(config.grid_spacing!=null?Math.max(0,parseInt(config.grid_spacing)||0):0)

let spawnTop=null
if(cellsLeft.length>0){
let maxBottom=-Infinity
for(let c of cellsLeft){ let b=wallClientRect(c).bottom; if(b>maxBottom) maxBottom=b }
spawnTop=maxBottom+spacingRow
}
spawnImage(col,spawnTop)
return
}

requestAnimationFrame(check)
}

}

async function updateCacheSw(){
if(config.cache_enabled&&"serviceWorker"in navigator){
try{
let swUrl=(typeof pfUrl==="function"?pfUrl("/sw.js"):"/sw.js")+"?t="+Date.now()
let swScope=(typeof PF_BASE==="string" && PF_BASE)?(String(PF_BASE).replace(/\/$/,"")+"/"):"/"
await navigator.serviceWorker.register(swUrl,{scope:swScope})
addDebugLog("Cache SW registriert (TTL "+ (config.cache_ttl_minutes||30) +"min)")
console.log("[WALL GRID] Cache SW registriert")
notifyServerState("online")
await refreshCacheInventory()
}catch(e){ addDebugLog("Cache SW Fehler: "+e.message); console.error("[WALL GRID] Cache SW:",e) }
}else if("serviceWorker"in navigator){
try{
let regs=await navigator.serviceWorker.getRegistrations()
for(let r of regs) await r.unregister()
addDebugLog("Cache SW deaktiviert")
console.log("[WALL GRID] Cache SW deaktiviert")
}catch(e){}
}
}

async function applyWakeLock(){
let enabled=config.screen_wake_lock_enabled
let altEnabled=config.screen_wake_lock_alternative

if(!altEnabled){
if(altWakeLockVideo){ altWakeLockVideo.pause(); altWakeLockVideo.srcObject=null; altWakeLockVideo.remove(); altWakeLockVideo=null }
if(altWakeLockCanvas){ altWakeLockCanvas.remove(); altWakeLockCanvas=null }
if(altWakeLockTick){ cancelAnimationFrame(altWakeLockTick); altWakeLockTick=null }
altWakeLockActive=false
}

if(!enabled){
if(wakeLockSentinel){ try{ await wakeLockSentinel.release() }catch(e){} wakeLockSentinel=null }
wakeLockActive=false
}else{
if(!navigator.wakeLock){ wakeLockActive=false }
else if(document.visibilityState==="visible"){
try{
wakeLockSentinel=await navigator.wakeLock.request("screen")
wakeLockActive=true
wakeLockSentinel.addEventListener("release",()=>{ wakeLockActive=false })
}catch(e){ wakeLockActive=false }
}
}

if(altEnabled&&typeof HTMLCanvasElement!=="undefined"&&HTMLCanvasElement.prototype.captureStream){
if(altWakeLockVideo) return
try{
let canvas=document.createElement("canvas")
canvas.width=2
canvas.height=2
canvas.style.cssText="position:fixed;top:-9999px;left:-9999px;width:1px;height:1px;opacity:0;pointer-events:none;"
document.body.appendChild(canvas)
let ctx=canvas.getContext("2d")
let stream=canvas.captureStream(1)
let video=document.createElement("video")
video.srcObject=stream
video.muted=true
video.autoplay=true
video.playsInline=true
video.setAttribute("playsinline","")
video.style.cssText="position:fixed;top:-9999px;left:-9999px;width:1px;height:1px;opacity:0;pointer-events:none;"
document.body.appendChild(video)
video.play().catch(()=>{})
altWakeLockVideo=video
altWakeLockCanvas=canvas
altWakeLockActive=true
function tick(){
if(!altWakeLockCanvas) return
ctx.fillStyle="#000"
ctx.fillRect(0,0,2,2)
altWakeLockTick=requestAnimationFrame(tick)
}
tick()
}catch(e){ altWakeLockActive=false }
}
}
document.addEventListener("visibilitychange",async()=>{
if(document.visibilityState==="visible"&&config.screen_wake_lock_enabled&&navigator.wakeLock){
try{
wakeLockSentinel=await navigator.wakeLock.request("screen")
wakeLockActive=true
wakeLockSentinel.addEventListener("release",()=>{ wakeLockActive=false })
}catch(e){ wakeLockActive=false }
}
})

function setupQR(){
let box=document.getElementById("qrContainer")
if(!box) return
if(!config.show_qr_code){
box.style.display="none"
return
}
box.style.display="block"
fetch("/api/upload_url")
.then(r=>r.json())
.then(data=>{
let qrBox=document.getElementById("qrCode")
if(!qrBox) return
qrBox.innerHTML=""
if(typeof QRCode==="function"){
new QRCode(qrBox,{
text:data.url,

}
})

}

function setQRPosition(){
let box=document.getElementById("qrContainer")
if(!box) return
let p=config.qr_position
box.style.top=""
box.style.bottom=""
box.style.left=""
box.style.right=""
box.style.transform=""
if(p==="center-bottom"){
box.style.left="50%"
box.style.bottom="20px"
box.style.transform="translateX(-50%)"
}
if(p==="top-left"){ box.style.top="20px"; box.style.left="20px" }
if(p==="top-right"){ box.style.top="20px"; box.style.right="20px" }
if(p==="bottom-left"){ box.style.bottom="20px"; box.style.left="20px" }
if(p==="bottom-right"){ box.style.bottom="20px"; box.style.right="20px" }
}

function cycleQR(){
let box=document.getElementById("qrContainer")
if(!box) return
if(qrTimer) clearInterval(qrTimer)
qrTimer=setInterval(()=>{
let elapsed=(Date.now()-wallStartTime)/1000
let cycle=(config.qr_show_duration||5)+(config.qr_hide_duration||5)
let phase=elapsed%cycle
box.style.opacity=phase<(config.qr_show_duration||5)?1:0
},500)
}

function setupBanner(){
let banner=document.getElementById("banner")
if(!banner) return
if(!config.banner_enabled){
banner.style.display="none"
return
}
banner.style.display="flex"
banner.style.background=config.banner_color
banner.style.color=config.banner_text_color
banner.style.height=config.banner_height+"px"
banner.style.setProperty("--banner-h",(config.banner_height||120)+"px")
let align=(window.COMMENT_FONTS&&COMMENT_FONTS.align)?COMMENT_FONTS.align(config.banner_align):"center"
banner.style.justifyContent=align==="left"?"flex-start":align==="right"?"flex-end":"center"
let bannerFont=config.banner_font||"Arial"
banner.style.fontFamily=(window.COMMENT_FONTS&&COMMENT_FONTS.stack)?COMMENT_FONTS.stack(bannerFont):bannerFont
banner.innerHTML="<div class='bannerContent is-"+align+"'>"+((window.simpleMd&&simpleMd.mdToHtml)?simpleMd.mdToHtml(config.banner_text):((window.marked&&marked.parse)?marked.parse(config.banner_text||""):(config.banner_text||"")))+"</div>"
if(config.banner_position==="top") banner.style.top=0
if(config.banner_position==="bottom") banner.style.bottom=0
if(window.fitBannerText) fitBannerText(banner, banner.querySelector(".bannerContent"))
cycleBanner()
}

function cycleBanner(){
let banner=document.getElementById("banner")
if(!banner) return
if(bannerTimer) clearInterval(bannerTimer)
bannerTimer=setInterval(()=>{
let elapsed=(Date.now()-wallStartTime)/1000
let cycle=(config.banner_show_duration||10)+(config.banner_hide_duration||10)
let phase=elapsed%cycle
banner.style.opacity=phase<(config.banner_show_duration||10)?1:0
},500)
}

window.addEventListener("resize", function(){
let banner=document.getElementById("banner")
if(!banner || banner.style.display==="none") return

})

async function init(){
connectWebSocket()
connectionWatchdog()

let cfgRes=await fetch("/api/config")
config=await cfgRes.json()||{}
if(window.applyWallDisplayRotation) applyWallDisplayRotation(config)

applyBackground()
loadCommentFont()
setupQR()
setupBanner()
if(config.cache_enabled && wsIsOpen()) setConnection("online")
updateDebug()
await updateCacheSw()

let res=await fetch("/api/images")
let files=await res.json()
if(!Array.isArray(files)) files=[]

for(let f of files) addMedia(f)
mediaListLoaded=true
if(window.prefetchPhotoComments) prefetchPhotoComments(files)

setInterval(updateDebug,500)

let cols=Math.max(1,parseInt(config.grid_columns)||4)

function checkSpawnNextRow(){
if(photowallPaused) return
let spacingRow="grid_spacing_rows"in config?Math.max(0,parseInt(config.grid_spacing_rows)||0):(config.grid_spacing!=null?Math.max(0,parseInt(config.grid_spacing)||0):0)
for(let col=0;col<cols;col++){
let cellsInCol=Array.from(document.querySelectorAll(".gridCell")).filter(c=>parseInt(c.dataset.colIndex,10)===col)
if(cellsInCol.length===0){
spawnImage(col)
continue
}
let bottomMost=null
let maxBottom=-Infinity
for(let c of cellsInCol){
let b=wallClientRect(c).bottom
if(b>maxBottom){ maxBottom=b; bottomMost=c }
}
let spawnThreshold=wallInnerHeight()+200
if(bottomMost&&maxBottom<=spawnThreshold&&!bottomMost.dataset.spawnedNext){
bottomMost.dataset.spawnedNext="1"
let spawnTop=maxBottom+spacingRow
spawnImage(col,spawnTop)
}
}
}
setInterval(checkSpawnNextRow,300)

function startGridPhotowall(){
photowallPaused=false
cols=Math.max(1,parseInt(config.grid_columns)||4)
if(!document.querySelector(".gridCell")){
for(let c=0;c<cols;c++) spawnImage(c)
}
}

function restartGridPhotowall(){
document.querySelectorAll(".gridCell").forEach(c=>dropCell(c))
reservedImages.clear()
photowallPaused=false
cols=Math.max(1,parseInt(config.grid_columns)||4)
for(let c=0;c<cols;c++) spawnImage(c)
}

window.pfPhotowall={
pause:function(){ photowallPaused=true },
resume:function(){ photowallPaused=false },
start:restartGridPhotowall,
clear:function(){ document.querySelectorAll(".gridCell").forEach(c=>dropCell(c)); reservedImages.clear() },
startTimers:startGridPhotowall,
isPaused:function(){ return photowallPaused }
}

if(window.pfWallManager&&pfWallManager.boot) await pfWallManager.boot()
else startGridPhotowall()
}

init()
