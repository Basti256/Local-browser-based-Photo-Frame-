<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anmeldung</title>
<link rel="stylesheet" href="/static/ui.css">
</head>
<body>
<div class="wrap">
<div class="card">
<h1>Anmeldung</h1>
<p class="muted">Konto <strong>Admin</strong> für die Einrichtungsseite.</p>
<form id="f">
<input type="text" name="username" value="Admin" autocomplete="username" hidden>
<label for="password">Passwort</label>
<input id="password" name="password" type="password" autocomplete="current-password" required>
<div class="error" id="err" hidden></div>
<p class="muted" id="wait" hidden></p>
<button type="submit" id="btn">Anmelden</button>
</form>
</div>
</div>
<script>
const params = new URLSearchParams(location.search);
let waitTimer = null;
function setWait(sec){
  const el = document.getElementById("wait");
  const btn = document.getElementById("btn");
  if (waitTimer) clearInterval(waitTimer);
  if (!sec || sec <= 0){
    el.hidden = true;
    btn.disabled = false;
    return;
  }
  let left = sec;
  el.hidden = false;
  btn.disabled = true;
  const tick = () => {
    el.textContent = "Login unter /login gesperrt noch " + Math.ceil(left) + " s (zu viele Fehlversuche).";
    if (left <= 0){
      clearInterval(waitTimer);
      el.hidden = true;
      btn.disabled = false;
      return;
    }
    left -= 0.2;
  };
  tick();
  waitTimer = setInterval(tick, 200);
}
function detailInfo(data){
  const d = data && data.detail;
  if (d && typeof d === "object") return {message: d.message || "Anmeldung fehlgeschlagen.", wait: Number(d.wait_seconds) || 0};
  return {message: typeof d === "string" ? d : "Anmeldung fehlgeschlagen.", wait: 0};
}
document.getElementById("f").onsubmit = async (e) => {
  e.preventDefault();
  const err = document.getElementById("err");
  err.hidden = true;
  const res = await fetch("/api/login", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      password: document.getElementById("password").value
    })
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const info = detailInfo(data);
    err.textContent = info.message;
    err.hidden = false;
    setWait(info.wait);
    return;
  }
  location.href = params.get("next") || "/setup";
};
fetch("/api/setup/status").then(r => r.json()).then(s => {
  if (s.first_run) location.href = "/setup";
  if (s.login_lock && s.login_lock.locked) setWait(s.login_lock.wait_seconds);
});
</script>
</body>
</html>
