<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foto Upload</title>
<script>
(function(){try{var t=localStorage.getItem("pf-admin-theme");if(t==="light"||t==="dark"||t==="system")document.documentElement.setAttribute("data-theme",t);else document.documentElement.setAttribute("data-theme","system");}catch(e){document.documentElement.setAttribute("data-theme","system");}})();
</script>
<link rel="stylesheet" href="/static/admin-theme.css">
<script src="/static/comment-fonts.js"></script>
<script src="/static/simple-md.js"></script>
<script src="/static/header.js"></script>
<script src="/static/debug-comments.js"></script>
<script src="/static/admin-theme.js"></script>
<style>
body{font-family:var(--pf-font, system-ui);background:var(--pf-bg, #f5f7fb);color:var(--pf-ink, #1b1b1b);margin:0;padding:0;text-align:center;}
.greeting{margin:0 0 16px 0;overflow-wrap:anywhere;word-wrap:break-word;line-height:1.25;}
.greeting h1{margin:0.12em 0;font-size:1.6em;}
.greeting h2{margin:0.12em 0;font-size:1.25em;}
.greeting h3{margin:0.12em 0;font-size:1.1em;}
.greeting p{margin:0.12em 0;}
.greeting u,.greeting ins{text-decoration:underline;}
.greeting ul,.greeting ol{display:inline-block;text-align:left;margin:0.12em auto;}
.container{max-width:700px;margin:auto;padding:20px;}
.header-wrap{display:flex;justify-content:center;align-items:center;margin-bottom:15px;overflow:hidden;}
.header-wrap.is-rot-90{min-height:200px;}
.header-img{max-width:100%;max-height:280px;transform-origin:center center;}
.header-wrap.is-rot-90 .header-img{max-width:280px;max-height:100%;}
.upload-card{background:var(--pf-elev, #fff);padding:25px;border:1px solid var(--pf-stroke, #d4d1cb);}
#previewContainer{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin-top:20px;}
.preview{position:relative;width:150px;background:var(--pf-fill, #fafafa);padding:10px;border:1px solid var(--pf-stroke, #d4d1cb);}
.preview img,.preview video{width:100%;display:block;}
.comment-hint{font-size:12px;color:var(--pf-danger, #c00);margin-top:16px;margin-bottom:8px;}
.comment-count{font-size:11px;color:var(--pf-faint, #888);margin-top:4px;text-align:right;}
.removeBtn{position:absolute;top:6px;right:6px;background:#ff4b5c;color:white;border:none;border-radius:50%;width:24px;height:24px;cursor:pointer;font-size:14px;line-height:24px;padding:0;}
textarea{width:100%;height:50px;margin-top:8px;resize:none;border:1px solid var(--pf-stroke, #ddd);background:var(--pf-bg, #fff);color:var(--pf-ink, #1b1b1b);padding:5px;font-size:13px;}
.upload-btn{margin-top:20px;margin-right:8px;padding:12px 20px;border:none;background:#ff4b5c;color:white;font-size:16px;cursor:pointer;}
.upload-btn:hover{filter:brightness(1.1);}
.upload-btn:disabled{opacity:0.7;cursor:not-allowed;}
#uploadProgress{margin-top:15px;font-size:14px;color:var(--pf-muted, #666);overflow-wrap:anywhere;}
#uploadBtn{overflow-wrap:anywhere;}
.upload-theme{display:flex;justify-content:flex-end;margin-top:16px;}
</style>
</head>
<body>
<div class="container">
<div id="headerWrap" class="header-wrap" hidden>
<img id="headerImg" class="header-img" alt="">
</div>
<div id="greeting" class="greeting">Lade deine Fotos hoch</div>
<div class="upload-card">
<input id="fileInput" type="file" multiple accept="image/*,video/*">
<input id="cameraInput" type="file" accept="image/*" capture="environment" style="display:none">
<input id="videoInput" type="file" accept="video/*" capture="environment" style="display:none">
<br>
<button class="upload-btn" type="button" onclick="openCamera()">Foto aufnehmen</button>
<button class="upload-btn" type="button" id="videoBtn" onclick="openVideoCamera()">Video aufnehmen</button>
<div id="commentHint" class="comment-hint" style="display:none;"></div>
<div id="previewContainer"></div>
<div id="uploadProgress"></div>
<button id="uploadBtn" class="upload-btn" type="button" onclick="upload()">Upload starten</button>
</div>
<div class="upload-theme" data-pf-theme></div>
</div>
<script>
let MAX_COMMENT_LENGTH = 80;
let MAX_FILES = 20;
let MAX_FILE_SIZE_MB = 50;
let ALLOW_VIDEOS = true;
let DEBUG_RANDOM_COMMENTS = false;
let SHOW_UPLOAD_ETA = false;
let SHOW_UPLOAD_SPEED = false;
let selectedFiles = [];
let previewUrls = [];
let configLoaded = false;
let lastGreetingColor = "#222222";
const UPLOAD_CONCURRENCY = 4;
const IMAGE_EXTS = [".jpg", ".jpeg", ".png", ".webp", ".gif", ".heic", ".heif"];
const VIDEO_EXTS = [".mp4", ".mov", ".webm"];
const IMAGE_TYPES = ["image/jpeg", "image/jpg", "image/png", "image/webp", "image/gif", "image/heic", "image/heif"];
const VIDEO_TYPES = ["video/mp4", "video/quicktime", "video/webm"];

function uploadThemeIsDark(){
  const t = document.documentElement.getAttribute("data-theme") || "system";
  if(t === "dark") return true;
  if(t === "light") return false;
  try{ return !!(window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches); }
  catch(e){ return false; }
}

function hexLuminance(hex){
  const m = /^#?([0-9a-f]{6})$/i.exec(String(hex || "").trim());
  if(!m) return null;
  const n = parseInt(m[1], 16);
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
}

function applyGreetingColor(){
  const greet = document.getElementById("greeting");
  if(!greet) return;
  const configured = lastGreetingColor || "#222222";
  const lum = hexLuminance(configured);
  const dark = uploadThemeIsDark();
  if(lum == null){ greet.style.color = configured; return; }
  if((dark && lum < 0.45) || (!dark && lum > 0.72)) greet.style.color = "";
  else greet.style.color = configured;
}

function clampCommentMax(n){
  n = parseInt(n, 10);
  if(!isFinite(n) || n < 1) n = 80;
  return Math.min(500, n);
}

function clipUploadComment(text){
  if(window.clipComment) return clipComment(text, MAX_COMMENT_LENGTH);
  return String(text || "").slice(0, MAX_COMMENT_LENGTH);
}

function fillRandomComment(textarea){
  if(!DEBUG_RANDOM_COMMENTS || !textarea) return;
  if(String(textarea.value || "").trim()) return;
  const text = window.generateRandomComment ? generateRandomComment(MAX_COMMENT_LENGTH) : "";
  if(!text) return;
  textarea.value = clipUploadComment(text);
  if(textarea.value.length > textarea.maxLength && textarea.maxLength > 0){
    textarea.value = textarea.value.slice(0, textarea.maxLength);
  }
}

function applyCommentLimitToFields(){
  document.querySelectorAll("#previewContainer textarea").forEach(ta => {
    ta.maxLength = MAX_COMMENT_LENGTH;
    fillRandomComment(ta);
    ta.value = clipUploadComment(ta.value);
    if(ta.value.length > ta.maxLength && ta.maxLength > 0) ta.value = ta.value.slice(0, ta.maxLength);
    const count = ta.parentElement && ta.parentElement.querySelector(".comment-count");
    if(count) count.textContent = ta.value.length + " / " + MAX_COMMENT_LENGTH;
  });
  const hint = document.getElementById("commentHint");
  if(selectedFiles.length > 0){
    hint.textContent = "Max. " + MAX_COMMENT_LENGTH + " Zeichen erlaubt";
    hint.style.display = "block";
  }
}

function applyUploadLimits(cfg){
  MAX_COMMENT_LENGTH = clampCommentMax(cfg.comment_max_length);
  MAX_FILES = cfg.upload_max_files || 20;
  MAX_FILE_SIZE_MB = cfg.upload_max_file_size_mb || 50;
  ALLOW_VIDEOS = cfg.upload_allow_videos !== false;
  DEBUG_RANDOM_COMMENTS = !!cfg.debug_random_comments;
  SHOW_UPLOAD_ETA = !!cfg.upload_show_eta;
  SHOW_UPLOAD_SPEED = !!cfg.upload_show_speed;
  applyCommentLimitToFields();
}

async function refreshUploadLimits(){
  try{
    const cfg = await (await fetch("/api/config")).json();
    applyUploadLimits(cfg);
  }catch(e){}
}

async function loadUploadConfig(){
  try{
    const cfg = await (await fetch("/api/config")).json();
    applyUploadLimits(cfg);
    if(configLoaded) return;
    const greet = document.getElementById("greeting");
    const raw = cfg.upload_greeting || "Lade deine Fotos hoch";
    greet.innerHTML = (window.simpleMd && simpleMd.mdToHtml) ? simpleMd.mdToHtml(raw) : raw.replace(/</g,"&lt;");
    const align = (window.COMMENT_FONTS && COMMENT_FONTS.align) ? COMMENT_FONTS.align(cfg.upload_greeting_align) : "center";
    const font = cfg.upload_greeting_font || "Arial";
    greet.style.textAlign = align;
    greet.style.fontFamily = (window.COMMENT_FONTS && COMMENT_FONTS.stack) ? COMMENT_FONTS.stack(font) : font;
    lastGreetingColor = cfg.upload_greeting_color || "#222222";
    applyGreetingColor();
    greet.style.fontSize = (cfg.upload_greeting_size || 28) + "px";
    greet.style.fontWeight = cfg.upload_greeting_bold !== false ? "bold" : "normal";
    greet.style.textDecoration = cfg.upload_greeting_underline ? "underline" : "none";
    if(window.COMMENT_FONTS && COMMENT_FONTS.loadOne) COMMENT_FONTS.loadOne(font, "uploadGreetingFont");
    const btnColor = cfg.upload_button_color || "#ff4b5c";
    document.querySelectorAll(".upload-btn").forEach(b => b.style.background = btnColor);
    const imageRaw = cfg.upload_image || "";
    const image = (!imageRaw) ? "" : (imageRaw.startsWith("http") ? imageRaw : (typeof pfUrl === "function" ? pfUrl(imageRaw.startsWith("/") ? imageRaw : ("/header/" + imageRaw)) : (imageRaw.startsWith("/") ? imageRaw : ("/header/" + imageRaw))));
    const wrap = document.getElementById("headerWrap");
    const img = document.getElementById("headerImg");
    if(image){
      img.src = image;
      wrap.hidden = false;
      const rot = window.normHeaderRotation ? normHeaderRotation(cfg.upload_image_rotation) : 0;
      wrap.classList.toggle("is-rot-90", rot === 90 || rot === 270);
      if(window.applyHeaderRotation) applyHeaderRotation(img, rot);
      else img.style.transform = rot ? ("rotate(" + rot + "deg)") : "";
    }
    document.getElementById("videoBtn").hidden = !ALLOW_VIDEOS;
    document.getElementById("fileInput").accept = ALLOW_VIDEOS ? "image/*,video/*" : "image/*";
  }catch(e){}
  configLoaded = true;
}

function heartbeat(){ fetch("/api/upload_heartbeat").catch(()=>{}); }
loadUploadConfig().then(()=>{});
heartbeat();
try{
  new MutationObserver(applyGreetingColor).observe(document.documentElement, {attributes: true, attributeFilter: ["data-theme"]});
  if(window.matchMedia) matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyGreetingColor);
}catch(e){}
setInterval(heartbeat, 10000);
setInterval(refreshUploadLimits, 4000);
document.addEventListener("visibilitychange", () => { if(!document.hidden) refreshUploadLimits(); });
window.addEventListener("focus", refreshUploadLimits);

function openCamera(){ document.getElementById("cameraInput").click(); }
function openVideoCamera(){ document.getElementById("videoInput").click(); }
document.getElementById("cameraInput").addEventListener("change", e => handleFiles(e.target.files).catch(()=>{}));
document.getElementById("videoInput").addEventListener("change", e => handleFiles(e.target.files).catch(()=>{}));
document.getElementById("fileInput").addEventListener("change", e => handleFiles(e.target.files).catch(()=>{}));

function fileExt(file){
  const name = String((file && file.name) || "").toLowerCase();
  const dot = name.lastIndexOf(".");
  return dot >= 0 ? name.slice(dot) : "";
}
function isImageFile(file){
  const t = (file && file.type) || "";
  if(t && IMAGE_TYPES.indexOf(t) >= 0) return true;
  return IMAGE_EXTS.indexOf(fileExt(file)) >= 0;
}
function isVideoFile(file){
  const t = (file && file.type) || "";
  if(t && VIDEO_TYPES.indexOf(t) >= 0) return true;
  return VIDEO_EXTS.indexOf(fileExt(file)) >= 0;
}
function isValidFile(file){
  if(isImageFile(file)) return true;
  if(ALLOW_VIDEOS && isVideoFile(file)) return true;
  return false;
}
function revokePreviews(){
  previewUrls.forEach(u => { try { URL.revokeObjectURL(u); } catch(e){} });
  previewUrls = [];
}
function removeFile(index){ selectedFiles.splice(index,1); renderPreview(); }
function renderPreview(){
  revokePreviews();
  const hint = document.getElementById("commentHint");
  const container = document.getElementById("previewContainer");
  container.innerHTML = "";
  if(selectedFiles.length > 0){
    hint.textContent = "Max. " + MAX_COMMENT_LENGTH + " Zeichen erlaubt";
    hint.style.display = "block";
  } else hint.style.display = "none";
  selectedFiles.forEach((file, index) => {
    const div = document.createElement("div");
    div.className = "preview";
    const remove = document.createElement("button");
    remove.textContent = "✕";
    remove.className = "removeBtn";
    remove.onclick = () => removeFile(index);
    div.appendChild(remove);
    if(isImageFile(file)){
      const img = document.createElement("img");
      const u = URL.createObjectURL(file);
      previewUrls.push(u);
      img.src = u;
      div.appendChild(img);
    } else if(isVideoFile(file)){
      const vid = document.createElement("video");
      const u = URL.createObjectURL(file);
      previewUrls.push(u);
      vid.src = u;
      vid.controls = true;
      div.appendChild(vid);
    }
    const textarea = document.createElement("textarea");
    textarea.placeholder = "Kommentar";
    textarea.maxLength = MAX_COMMENT_LENGTH;
    textarea.id = "comment_" + index;
    const count = document.createElement("div");
    count.className = "comment-count";
    count.textContent = "0 / " + MAX_COMMENT_LENGTH;
    textarea.addEventListener("input", () => {
      textarea.value = clipUploadComment(textarea.value);
      if(textarea.value.length > textarea.maxLength && textarea.maxLength > 0) textarea.value = textarea.value.slice(0, textarea.maxLength);
      count.textContent = textarea.value.length + " / " + MAX_COMMENT_LENGTH;
    });
    fillRandomComment(textarea);
    count.textContent = textarea.value.length + " / " + MAX_COMMENT_LENGTH;
    div.appendChild(textarea);
    div.appendChild(count);
    container.appendChild(div);
  });
}
async function handleFiles(files){
  await loadUploadConfig();
  const maxBytes = MAX_FILE_SIZE_MB * 1024 * 1024;
  const rejected = [];
  for(const f of files){
    if(!isValidFile(f)) rejected.push(f.name + ": Kein Bild oder Video");
    else if(f.size > maxBytes) rejected.push(f.name + ": Zu groß (max " + MAX_FILE_SIZE_MB + " MB)");
    else if(selectedFiles.length >= MAX_FILES) rejected.push(f.name + ": Max. " + MAX_FILES + " Dateien erlaubt");
    else selectedFiles.push(f);
  }
  if(rejected.length) alert("Folgende Dateien wurden verworfen:\n\n" + rejected.join("\n"));
  renderPreview();
}
function uploadWithProgress(file, comment, onProgress){
  return new Promise((resolve, reject) => {
    const formData = new FormData();
    formData.append("file", file);
    formData.append("comment", comment);
    const xhr = new XMLHttpRequest();
    xhr.upload.addEventListener("progress", e => {
      const loaded = e.loaded;
      const total = e.lengthComputable ? e.total : file.size;
      const pct = total ? Math.round((loaded / total) * 100) : 0;
      onProgress(pct, loaded);
    });
    xhr.addEventListener("load", () => {
      onProgress(100, file.size || 0);
      if(xhr.status >= 200 && xhr.status < 300) resolve();
      else {
        let msg = "Upload fehlgeschlagen";
        try { const j = JSON.parse(xhr.responseText); if(j.detail) msg = j.detail; } catch(e){}
        reject(new Error(msg));
      }
    });
    xhr.addEventListener("error", () => reject(new Error("Netzwerkfehler")));
    const dest = (typeof pfUrl === "function") ? pfUrl("/upload") : "/upload";
    xhr.open("POST", dest);
    xhr.send(formData);
  });
}
function formatRemain(sec){
  if(!isFinite(sec) || sec < 0) return "";
  sec = Math.round(sec);
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  if(h > 0) return h + "h " + m + "min verbleibend";
  if(m > 0) return m + "min " + s + "s verbleibend";
  return s + "s verbleibend";
}
function formatBitrate(bitsPerSec){
  if(!isFinite(bitsPerSec) || bitsPerSec < 0) return "";
  if(bitsPerSec >= 1000000){
    const m = bitsPerSec / 1000000;
    const t = m >= 10 ? String(Math.round(m)) : m.toFixed(1).replace(/\.0$/, "");
    return "U: " + t + " Mbit/s";
  }
  return "U: " + Math.max(0, Math.round(bitsPerSec / 1000)) + " kbit/s";
}
async function upload(){
  if(selectedFiles.length === 0){ alert("Bitte zuerst Fotos oder Videos auswählen."); return; }
  const btn = document.getElementById("uploadBtn");
  const progressEl = document.getElementById("uploadProgress");
  btn.disabled = true;
  const files = selectedFiles.slice();
  const comments = files.map((_, i) => {
    const commentField = document.getElementById("comment_" + i);
    if(commentField) fillRandomComment(commentField);
    return clipUploadComment(commentField ? commentField.value : "");
  });
  const total = files.length;
  const totalBytes = files.reduce((sum, f) => sum + (f.size || 0), 0);
  const loadedBytes = new Array(total).fill(0);
  const succeeded = new Array(total).fill(false);
  const failed = [];
  let finished = 0;
  let lastAt = 0;
  let lastBytes = 0;
  let speedEma = 0;
  function bytesNow(){
    let n = 0;
    for(let i = 0; i < total; i++) n += loadedBytes[i];
    return n;
  }
  function updateProgress(){
    const doneBytes = bytesNow();
    const overall = totalBytes > 0 ? Math.min(100, Math.round((doneBytes / totalBytes) * 100)) : Math.round((finished / total) * 100);
    const now = (typeof performance !== "undefined" && performance.now) ? performance.now() : Date.now();
    if(!lastAt){
      lastAt = now;
      lastBytes = doneBytes;
    }else if(now - lastAt >= 250){
      const dt = (now - lastAt) / 1000;
      if(dt > 0){
        const inst = Math.max(0, (doneBytes - lastBytes) * 8 / dt);
        speedEma = speedEma ? (speedEma * 0.7 + inst * 0.3) : inst;
      }
      lastAt = now;
      lastBytes = doneBytes;
    }
    let extra = "";
    if(SHOW_UPLOAD_ETA && speedEma > 8000 && doneBytes < totalBytes){
      const remain = (totalBytes - doneBytes) / (speedEma / 8);
      extra += " (" + formatRemain(remain) + ")";
    }
    if(SHOW_UPLOAD_SPEED && speedEma > 0){
      extra += " (" + formatBitrate(speedEma) + ")";
    }
    const text = "Wird hochgeladen... " + finished + "/" + total + " (" + overall + "%)" + extra;
    progressEl.textContent = text;
    btn.textContent = text;
  }
  async function runOne(i){
    try{
      await uploadWithProgress(files[i], comments[i], (_pct, loaded) => {
        loadedBytes[i] = loaded || 0;
        updateProgress();
      });
      succeeded[i] = true;
      loadedBytes[i] = files[i].size || loadedBytes[i];
    }catch(err){
      failed.push((files[i].name || "Datei") + ": " + (err && err.message ? err.message : "Unbekannter Fehler"));
    }finally{
      finished++;
      updateProgress();
    }
  }
  let next = 0;
  async function worker(){
    while(true){
      const i = next++;
      if(i >= total) return;
      await runOne(i);
    }
  }
  const nWorkers = Math.min(UPLOAD_CONCURRENCY, total);
  await Promise.all(Array.from({length: nWorkers}, worker));
  selectedFiles = files.filter((_, i) => !succeeded[i]);
  renderPreview();
  btn.textContent = "Upload starten";
  progressEl.textContent = "";
  if(failed.length === 0){
    alert("Upload erfolgreich");
    location.reload();
    return;
  }
  btn.disabled = false;
  const okN = total - failed.length;
  if(okN > 0){
    alert("Teilweise hochgeladen (" + okN + "/" + total + "). Fehlgeschlagen:\n\n" + failed.join("\n"));
  } else {
    alert("Fehler beim Upload:\n\n" + failed.join("\n"));
  }
}
</script>
</body>
</html>
